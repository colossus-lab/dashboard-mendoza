<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada — Mendoza, en datos</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: #06090f;
      color: #e8ecf4;
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
      border-left: 4px solid #74acdf;
    }
    main { max-width: 44rem; padding: 2rem; }
    p.code { font-family: ui-monospace, monospace; font-size: 0.75rem; letter-spacing: 0.16em; color: #8892a8; margin: 0 0 0.75rem; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 1rem; }
    p { color: #8892a8; }
    a { color: #74acdf; font-weight: 500; text-decoration: none; }
    a:hover { color: #f6b40e; }
    @media (prefers-color-scheme: light) {
      body { background: #f2ede2; color: #11142e; }
      p, p.code { color: #4a5170; }
      a { color: #1f4e89; }
      a:hover { color: #c03a18; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté mal escrito o que el informe se haya movido.</p>
    <a href="/">Volver a la portada →</a>
  </main>
</body>
</html>
